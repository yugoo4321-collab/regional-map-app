name: Portfolio quality

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Compile application
        run: python -m py_compile app.py population_factors_tab.py project_portfolio_tab.py

      - name: Validate source data
        run: python validate_project.py

      - name: Run integrity tests
        run: python -m unittest discover -s tests -v
